name: Extract PDF, generate dataset and images

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install PyMuPDF

      - name: Run extractor script
        run: |
          python scripts/extract.py

      - name: Run verification script
        run: |
          if [ -f scripts/verify_dataset.py ]; then
            python scripts/verify_dataset.py data/dataset.json
          else
            echo "No verification script found."
          fi

      - name: Commit data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git commit -m "Auto-generated compliant dataset and images" || echo "No changes"
          git push
